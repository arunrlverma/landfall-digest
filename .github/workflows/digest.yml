name: Hourly digest

# The "relay": no server, no hosting bill, nothing to operate. A scheduled job
# runs the same scan the app can run locally, and commits the result as a static
# file. The app fetches that file and renders instantly; if this is ever
# unreachable, the app falls back to scanning on-device, so the failure mode is
# "slow", never "broken".
#
# The digest is identical for everyone — it is not personalized — so computing
# it once instead of on every phone is strictly better.

on:
  schedule:
    - cron: "0 * * * *"      # hourly, on the hour (~$0.50/day of scoring)
  workflow_dispatch:          # and on demand, for testing

permissions:
  contents: write             # to commit digest.json back

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A hand-authored digest with "pinned": true is an editorial decision —
      # the robot yields to it until the flag is removed.
      - name: Respect a pinned digest
        id: pin
        run: |
          if [ -f public/digest.json ] && \
             python3 -c "import json,sys; sys.exit(0 if json.load(open('public/digest.json')).get('pinned') else 1)"; then
            echo "pinned=true" >> "$GITHUB_OUTPUT"
            echo "digest is pinned — skipping this run"
          else
            echo "pinned=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build digest
        if: steps.pin.outputs.pinned == 'false'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          mkdir -p public
          python3 tools/relay/build_digest.py --out public/digest.json

      - name: Sanity-check before publishing
        if: steps.pin.outputs.pinned == 'false'
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("public/digest.json"))
          picks = d.get("picks", [])
          # Never publish an empty or broken digest over a good one — a bad
          # scrape would otherwise blank the app's Today tab for a whole day.
          if len(picks) < 3:
              sys.exit(f"only {len(picks)} picks; refusing to publish")
          for p in picks:
              assert p.get("audioURL") and p.get("title") and p.get("reason")
          print(f"ok: {len(picks)} picks")
          PY

      - name: Commit
        if: steps.pin.outputs.pinned == 'false'
        run: |
          git config user.name  "digest-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/digest.json
          git diff --staged --quiet || git commit -m "digest: $(date -u +%Y-%m-%d)"
          # A code push landing mid-run advances main and would reject this
          # push; rebasing our one digest.json commit over it is always clean.
          git pull --rebase origin main
          git push
